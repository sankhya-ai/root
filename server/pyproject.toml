[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tura-code"
version = "0.1.0"
description = "root: a coding agent host for the kimi-agent-rs runtime, with Jev step direction and Dhee memory"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  # The team line: the relay connection and end-to-end sealing.
  "websockets>=13.0",
  # The owner's terminal tab: a shell behind a pseudo-terminal (POSIX).
  "ptyprocess>=0.7,<1",
  "cryptography>=42.0",
  # Documents: reading and editing PDFs and spreadsheets.
  "pypdf>=5.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# Dhee is the memory layer. Without it the agent still runs; it simply has no
# long-term memory tools and no per-turn memory context.
memory = [
  "dhee[openai,zvec]>=7.4.4,<8",
]
# Credentials in the macOS Keychain (the app sets TURA_CODE_SECRETS=keychain).
keychain = [
  "keyring>=25",
]
dev = [
  "keyring>=25",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[project.scripts]
root = "tura_code.cli:main"
tura-code = "tura_code.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tura_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning:dhee.*",
]
