[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tura-code"
version = "0.1.0"
description = "root: a coding agent host for the kimi-agent-rs runtime, with Jev step direction and Dhee memory"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
# Dhee is the memory layer. Without it the agent still runs; it simply has no
# long-term memory tools and no per-turn memory context.
memory = [
  "dhee[openai,zvec]>=7.4.3,<8",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[project.scripts]
tura-code = "tura_code.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tura_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning:dhee.*",
]
