name: CI

on:
  push:
  pull_request:

jobs:
  runtime:
    name: Runtime (Rust)
    runs-on: ubuntu-latest
    env:
      # Dozens of test binaries with full debug info fill the runner's disk
      # (the linker dies with SIGBUS); line tables are enough for backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo test --manifest-path runtime/Cargo.toml --workspace

  server:
    name: Host (Python) — end to end against the runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo build --release --manifest-path runtime/Cargo.toml --bin kimi-agent
      # The hosted-mode sandbox test runs inside bubblewrap; it skips itself
      # where the runner does not allow user namespaces.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -e "./server[memory,dev]"
      - run: python -m pytest -q
        working-directory: server

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test && npm run build
        working-directory: ui

  windows:
    name: Host on Windows — end to end against the runtime
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --manifest-path runtime/Cargo.toml --bin kimi-agent
      - run: cargo test --release --manifest-path runtime/Cargo.toml -p kimi-agent --lib persistent_shell
      - run: python -m pip install -e "./server[memory,dev]"
      # A hang fails its own test (with a traceback) instead of the whole job.
      - run: python -m pytest -v -rfEs --timeout=180
        working-directory: server

  macos:
    name: Host on macOS, and the app builds
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --manifest-path runtime/Cargo.toml --bin kimi-agent
      - run: python -m pip install -e "./server[memory,dev]"
      - run: python -m pytest -q
        working-directory: server
      - run: swift build -c release --package-path macos

