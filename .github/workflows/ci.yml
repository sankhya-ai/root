name: CI

on:
  push:
  pull_request:

jobs:
  runtime:
    name: Runtime (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo test --manifest-path runtime/Cargo.toml --workspace

  server:
    name: Host (Python) — end to end against the runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo build --release --manifest-path runtime/Cargo.toml --bin kimi-agent
      # The hosted-mode sandbox test runs inside bubblewrap; it skips itself
      # where the runner does not allow user namespaces.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -e "./server[memory,dev]"
      - run: python -m pytest -q
        working-directory: server

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test && npm run build
        working-directory: ui

  macos:
    name: Host on macOS, and the app builds
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --manifest-path runtime/Cargo.toml --bin kimi-agent
      - run: python -m pip install -e "./server[memory,dev]"
      - run: python -m pytest -q
        working-directory: server
      - run: swift build -c release --package-path macos

